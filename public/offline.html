<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#001B3A" />
    <title>Offline | Dormitory MS</title>
    <link rel="icon" href="/icons/favicon-32x32.png" type="image/png" />
    <style>
      :root {
        --bg: #f5f7fa;
        --fg: #0b172a;
        --surface: #ffffff;
        --border: #e2e8f0;
        --muted: #52627a;
        --navy: #002b5b;
        --navy-hover: #003b7a;
        --green: #146b26;
        --green-soft: #eaf6ed;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #060b14;
          --fg: #f1f5f9;
          --surface: #0c1424;
          --border: rgba(148, 163, 184, 0.16);
          --muted: #94a3b8;
          --navy: #1e6bb8;
          --navy-hover: #287bd0;
          --green: #4ade80;
          --green-soft: rgba(44, 165, 72, 0.16);
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background: var(--bg);
        color: var(--fg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        width: 100%;
        max-width: 400px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 32px 24px;
        text-align: center;
        box-shadow: 0 12px 32px -10px rgba(0, 27, 61, 0.14);
      }
      .logo-wrap {
        width: 64px;
        height: 64px;
        margin: 0 auto 18px;
        border-radius: 16px;
        background: #ffffff;
        padding: 8px;
        box-shadow: 0 2px 10px rgba(0, 27, 61, 0.08);
        border: 1px solid rgba(0, 0, 0, 0.06);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .logo-wrap img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        background: var(--green-soft);
        color: var(--green);
        margin-bottom: 12px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 22px;
        font-size: 13.5px;
        line-height: 1.55;
        color: var(--muted);
      }
      button {
        width: 100%;
        height: 44px;
        border: 0;
        border-radius: 12px;
        background: var(--navy);
        color: #ffffff;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 150ms ease;
      }
      button:hover {
        background: var(--navy-hover);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="logo-wrap">
        <img src="/icons/icon-192x192.png" alt="Dormitory Management System" />
      </div>
      <div class="badge">Offline Mode</div>
      <h1>You are currently offline</h1>
      <p>
        Dormitory Management System needs an internet connection to load live
        resident records and financial updates. We will reconnect automatically
        once you are back online.
      </p>
      <button type="button" onclick="window.location.reload()">
        Retry Connection
      </button>
    </main>
    <script>
      window.addEventListener("online", function () {
        window.location.reload();
      });
    </script>
  </body>
</html>
